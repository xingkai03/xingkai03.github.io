# Editor for xingkai03.github.io — open https://xingkai03.github.io/admin
# Saves are drafts (pull requests); "Publish" merges to main, and GitHub Actions redeploys (~1 min).
backend:
  name: github
  repo: xingkai03/xingkai03.github.io
  branch: main
  # Sign in with a GitHub personal access token (no login server needed).
  auth_methods: [token]
  # Drafts: published entries are squashed into one commit on main.
  squash_merges: true
  commit_messages:
    create: "Create {{collection}} “{{slug}}” (via editor)"
    update: "Update {{collection}} “{{slug}}” (via editor)"
    delete: "Delete {{collection}} “{{slug}}” (via editor)"
    uploadMedia: "Upload “{{path}}” (via editor)"
    deleteMedia: "Delete “{{path}}” (via editor)"

# Leave empty optional fields out of the files (an empty date would break the build).
output:
  omit_empty_optional_fields: true

# Save changes as drafts (each draft is a pull request on GitHub, which does
# not touch the live site). "Publish" merges it, which triggers one deploy.
publish_mode:
  type: editorial_workflow
  stages: [draft, pending_publish]

site_url: https://xingkai03.github.io
display_url: https://xingkai03.github.io

# Kept for older images already in the repo (public/images).
media_folder: public/images
public_folder: /images

# New uploads (images, CV) go to Cloudinary, not the repo, so the repo stays small.
# The editor stores only the Cloudinary link. Sign in to Cloudinary in its popup.
media_libraries:
  default: false
  cloudinary:
    config:
      cloud_name: aiigdmpw
      api_key: "294223915981181" # public key; the API secret is never needed here
      folder: website
      # Serve automatically compressed, modern formats (WebP/AVIF).
      default_transformations:
        - - quality: auto
            fetch_format: auto

collections:
  - name: blog
    label: Blog posts
    label_singular: Blog post
    folder: src/content/blog
    extension: mdx
    format: frontmatter
    create: true
    slug: "{{slug}}"
    preview_path: "blog/{{slug}}/"
    sortable_fields: [pubDate, title]
    summary: "{{title}} — {{pubDate | date('YYYY-MM-DD')}}"
    # Cover images must sit in src/assets so Astro can optimise them.
    media_folder: /src/assets
    public_folder: ../../assets
    fields: &post_fields
      - { name: title, label: Title, widget: string }
      - { name: description, label: Short description, widget: string, hint: "One sentence shown in post lists and search results." }
      - { name: pubDate, label: Published, widget: datetime, format: "MMM D YYYY", time_format: false, default: "{{now}}" }
      - { name: updatedDate, label: Last updated, widget: datetime, format: "MMM D YYYY", time_format: false, required: false }
      - { name: heroImage, label: Cover image, widget: image, required: false }
      - name: body
        label: Text
        widget: markdown
        # Raw Markdown first, so $math$ and ```mermaid blocks stay exactly as written.
        modes: [raw, rich_text]
        hint: "Markdown. Math: $x^2$ inline or $$ … $$ on its own lines. Diagrams: a ```mermaid code block."

  - name: de
    label: German notes
    label_singular: German note
    folder: src/content/de
    extension: mdx
    format: frontmatter
    create: true
    slug: "{{slug}}"
    preview_path: "de/{{slug}}/"
    media_folder: /src/assets
    public_folder: ../../assets
    fields: *post_fields

  - name: projects
    label: Projects
    label_singular: Project
    folder: src/content/projects
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    sortable_fields: [order, title]
    summary: "{{order}}. {{title}}"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: context, label: Context, widget: string, hint: "e.g. Group project · CM2013, KTH · 2026" }
      - { name: order, label: Order, widget: number, value_type: int, default: 10, hint: "Lower numbers are shown first." }
      - { name: featured, label: Show on home page, widget: boolean, default: false }
      - { name: summary, label: Summary, widget: text, hint: "2–3 sentences: the problem and what was built." }
      - { name: highlights, label: Highlights, widget: list, field: { name: item, label: Highlight, widget: text }, hint: "Your contribution and concrete results, one per item." }
      - { name: tools, label: Tools & skills, widget: list, field: { name: tool, label: Tool, widget: string } }
      - name: links
        label: Links
        widget: list
        required: false
        fields:
          - { name: label, label: Label, widget: string, hint: "e.g. Code on GitHub" }
          - { name: href, label: URL, widget: string }

  - name: apps
    label: Apps
    label_singular: App
    folder: src/content/apps
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    sortable_fields: [order, title]
    summary: "{{order}}. {{title}}"
    fields:
      - { name: title, label: Name, widget: string }
      - { name: description, label: Description, widget: text, hint: "One or two sentences on what the app does." }
      - { name: url, label: Link, widget: string, hint: "Full link (https://…) or a path on this site, e.g. /calories/" }
      - { name: icon, label: Icon, widget: image, required: false, hint: "Square icon. You can also paste a link, e.g. /calories/icon-192.png" }
      - { name: order, label: Order, widget: number, value_type: int, default: 10, hint: "Lower numbers are shown first." }
      - { name: tags, label: Tags, widget: list, required: false, field: { name: tag, label: Tag, widget: string } }

  - name: settings
    label: Site pages
    files:
      - name: home
        label: Home page & profile
        file: src/data/site.json
        format: json
        fields:
          - { name: name, label: Name, widget: string }
          - name: photo
            label: Photo
            widget: image
            required: false
            media_folder: /public/images/profile
            public_folder: /images/profile
            hint: "A square-ish portrait works best (it's shown as a circle). Leave empty to hide."
            media_libraries:
              cloudinary:
                config:
                  default_transformations:
                    - - { width: 400, height: 400, crop: fill, gravity: face, quality: auto, fetch_format: auto }
          - { name: headline, label: Headline, widget: text, hint: "One sentence under your name." }
          - { name: intro, label: Intro, widget: text }
          - { name: open_to, label: What you're looking for, widget: text, required: false, hint: "Shown in the highlighted box. Leave empty to hide." }
          - { name: languages, label: Languages, widget: string }
          - { name: email, label: Email, widget: string }
          - { name: linkedin_url, label: LinkedIn URL, widget: string, required: false, hint: "Leave empty to hide the LinkedIn button." }
          - name: cv_url
            label: CV (PDF)
            widget: file
            required: false
            media_folder: /public/cv
            public_folder: /cv
            hint: "Upload your CV. Leave empty to hide the Download CV button."
          - { name: github_url, label: GitHub URL, widget: string, required: false }
          - { name: x_url, label: X URL, widget: string, required: false }
