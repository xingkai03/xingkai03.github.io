<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SVT Learn</title>
<meta name="description" content="Find SVT Play clips where a Swedish word is said, and jump straight to that moment.">
<style>
:root{--bg:#f7f7f5;--card:#fff;--text:#1d1d1f;--muted:#6b6b6b;--line:#e4e4e0;--accent:#1f7a4d;--accent-soft:#e3f2ea;--chip:#f0f0ec}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--card:#1f1f1f;--text:#eee;--muted:#a0a0a0;--line:#333;--accent:#6fd3a0;--accent-soft:#1d3a2b;--chip:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:32px 16px 64px}
h1{margin:0 0 4px;font-size:28px;letter-spacing:-.01em}
.sub{margin:0 0 20px;color:var(--muted)}
form{display:flex;gap:8px;flex-wrap:wrap}
input[type=search],select{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text)}
input[type=search]{flex:1 1 260px;font-size:18px}
select{flex:0 1 220px;min-width:0}
label.opt{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.status{margin:16px 0 8px;font-size:14px;color:var(--muted)}
.ep{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.ep .prog{font-size:13px;color:var(--muted)}
.ep .name{font-weight:600}
.times{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.times a{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);text-decoration:none;font-size:14px;font-variant-numeric:tabular-nums}
.times a:hover{text-decoration:underline}
.until{font-size:12px;color:var(--muted);margin-left:6px}
.words{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.words button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--chip);color:var(--text);border-radius:999px;padding:3px 10px;cursor:pointer}
footer{margin-top:40px;font-size:13px;color:var(--muted)}
footer a{color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>SVT Learn</h1>
  <p class="sub">Search a Swedish word and jump to the moment it's said on SVT Play.</p>
  <form id="f" autocomplete="off">
    <input type="search" id="q" placeholder="t.ex. regeringen, väder, kultur" aria-label="Swedish word or words" autofocus>
    <select id="prog" aria-label="Programme"><option value="">All programmes</option></select>
    <label class="opt"><input type="checkbox" id="prefix"> word starts with</label>
  </form>
  <div class="status" id="status">Loading…</div>
  <div id="words" class="words"></div>
  <div id="results"></div>
  <footer>
    Links go to <a href="https://www.svtplay.se" rel="noopener">SVT Play</a>; some programmes can only be watched in Sweden.
    Episodes leave SVT Play after a while, so each one shows when it expires.
    This site holds only word positions, not SVT's subtitles. <span id="built"></span>
  </footer>
</main>
<script src="app.js"></script>
</body>
</html>
